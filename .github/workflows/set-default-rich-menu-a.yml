name: Set Default LINE Rich Menu A

on:
  workflow_dispatch:

jobs:
  set-default:
    runs-on: ubuntu-latest
    steps:
      - name: Set Rich Menu A as default
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          RICH_MENU_ID: richmenu-0b430043add88027d2c1f60070628525
        run: |
          python - <<'PY'
          import os
          import urllib.request
          import urllib.error

          token = os.environ["LINE_CHANNEL_ACCESS_TOKEN"]
          rich_menu_id = os.environ["RICH_MENU_ID"]
          url = f"https://api.line.me/v2/bot/user/all/richmenu/{rich_menu_id}"

          req = urllib.request.Request(
              url,
              headers={"Authorization": f"Bearer {token}"},
              method="POST"
          )

          try:
              with urllib.request.urlopen(req) as response:
                  print("HTTP", response.status)
                  print(response.read().decode("utf-8"))
          except urllib.error.HTTPError as e:
              print("HTTP", e.code)
              print(e.read().decode("utf-8"))
              raise
          PY
